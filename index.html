    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && typeof desc.get === 'function' && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: desc.get,
              set: function () {
                // Ignore third-party browser extension attempts to overwrite getter-only window.fetch
              },
              configurable: true,
              enumerable: desc.enumerable,
            });
          }
        } catch (_e) {
          // Do not interfere if window.fetch is non-configurable
        }

        function isExtensionError(filename, stack) {
          return (
            (typeof filename === 'string' && filename.indexOf('chrome-extension://') === 0) ||
            (typeof stack === 'string' && stack.indexOf('chrome-extension://') !== -1)
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var stack = event && event.error && event.error.stack;
            if (isExtensionError(event && event.filename, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var stack = reason && reason.stack;
            if (isExtensionError('', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
