# Validation-only workflow. This file previously deployed the RAW repository
# to GitHub Pages (no build), racing deploy.yml, which builds and publishes
# dist/. The raw-publishing job has been removed entirely: no pages:write
# permission, no artifact upload, no deploy step remains here.
# deploy.yml is the single GitHub Pages publisher.
name: Validate frontend build

on:
  # Manual only. Kept as a non-publishing smoke check; runs nothing on push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
